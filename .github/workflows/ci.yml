name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs if a new push arrives (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Cache DerivedData to speed up builds
    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-deriveddata-

    # Detect an available iOS simulator
    - name: Select iOS Simulator
      id: select-sim
      run: |
        # List simulators by preference order
        SIMULATORS=("iPhone 17 Pro" "iPhone 17" "iPhone 16e" "iPhone 15 Pro" "iPhone 15" "iPhone 14 Pro")

        AVAILABLE=$(python3 - <<'PY'
        import json
        import subprocess
        import sys

        result = subprocess.run(
            ["xcrun", "simctl", "list", "-j", "devices"],
            capture_output=True,
            text=True,
        )
        if result.returncode != 0:
            sys.stderr.write(result.stderr or result.stdout)
            sys.exit(result.returncode)
        if not result.stdout.strip():
            sys.stderr.write("xcrun simctl returned no output\n")
            sys.exit(1)

        data = json.loads(result.stdout)
        seen = set()
        names = []
        for devices in data.get("devices", {}).values():
            for device in devices:
                if not device.get("isAvailable"):
                    continue
                name = device.get("name")
                if not name or name in seen:
                    continue
                seen.add(name)
                names.append(name)

        print("\n".join(names))
        PY
        )

        for sim in "${SIMULATORS[@]}"; do
          if echo "$AVAILABLE" | grep -Fxq "$sim"; then
            echo "SIMULATOR_NAME=$sim" >> $GITHUB_OUTPUT
            echo "Selected simulator: $sim"
            exit 0
          fi
        done

        # Fallback: take the first available iPhone
        FIRST_IPHONE=$(echo "$AVAILABLE" | grep "^iPhone " | head -1 | xargs)
        if [ -n "$FIRST_IPHONE" ]; then
          echo "SIMULATOR_NAME=$FIRST_IPHONE" >> $GITHUB_OUTPUT
          echo "Selected simulator: $FIRST_IPHONE"
        else
          echo "No iPhone simulator found"
          exit 1
        fi

    # Build
    - name: Build
      run: |
        xcodebuild \
          -scheme BarPath \
          -destination "platform=iOS Simulator,name=${{ steps.select-sim.outputs.SIMULATOR_NAME }}" \
          -configuration Debug \
          clean build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    # Tests
    - name: Run Tests
      run: |
        xcodebuild test \
          -scheme BarPath \
          -destination "platform=iOS Simulator,name=${{ steps.select-sim.outputs.SIMULATOR_NAME }}" \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    # Upload test results on failure
    - name: Upload Test Results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
        retention-days: 5
